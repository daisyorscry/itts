<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Registration Update</title>
</head>
<body style="margin:0;padding:0;background:#f4efe4;font-family:Arial,sans-serif;color:#111827;">
  <div style="max-width:640px;margin:0 auto;padding:32px 20px;">
    <div style="background:#ffffff;border-radius:18px;padding:32px;border:1px solid rgba(17,24,39,0.08);">
      <div style="display:inline-block;background:#29E68C;color:#111827;font-weight:700;padding:10px 16px;border-radius:8px;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;">
        Event Update
      </div>
      <h1 style="margin:24px 0 12px;font-size:30px;line-height:1.1;">Your registration status changed</h1>
      <p style="margin:0 0 20px;font-size:16px;line-height:1.7;">
        Hi {{ .FullName }}, your registration for <strong>{{ .EventTitle }}</strong> has been updated.
      </p>

      <div style="background:#f7f4ec;border-radius:14px;padding:20px;border:1px solid rgba(17,24,39,0.08);">
        <p style="margin:0 0 8px;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#6b7280;">Current Status</p>
        <p style="margin:0;font-size:20px;font-weight:700;color:#111827;">{{ .Status }}</p>
      </div>

      {{ if .Reason }}
      <div style="margin-top:18px;background:#fff7ed;border-radius:14px;padding:20px;border:1px solid rgba(249,115,22,0.18);">
        <p style="margin:0 0 8px;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#9a3412;">Reason</p>
        <p style="margin:0;font-size:15px;line-height:1.7;color:#7c2d12;">{{ .Reason }}</p>
      </div>
      {{ end }}

      <p style="margin:24px 0 0;font-size:14px;line-height:1.7;color:#6b7280;">
        If you have questions about this event, please contact the ITTS event team.
      </p>
    </div>
  </div>
</body>
</html>
