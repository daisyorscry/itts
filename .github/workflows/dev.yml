name: Build and Push Backend via Build Machine

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

concurrency:
  group: build-push-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: self-hosted
    environment: dev

    steps:
      - name: Debug GitHub environment secrets
        run: |
          [ -n "${{ secrets.BUILD_USER }}" ] && echo "BUILD_USER OK" || echo "BUILD_USER EMPTY"
          [ -n "${{ secrets.BUILD_PASSWORD }}" ] && echo "BUILD_PASSWORD OK" || echo "BUILD_PASSWORD EMPTY"
          [ -n "${{ secrets.HARBOR_USERNAME }}" ] && echo "HARBOR_USERNAME OK" || echo "HARBOR_USERNAME EMPTY"
          [ -n "${{ secrets.HARBOR_PASSWORD }}" ] && echo "HARBOR_PASSWORD OK" || echo "HARBOR_PASSWORD EMPTY"

      - name: Build and push on build machine
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 192.168.10.2
          username: ${{ secrets.BUILD_USER }}
          password: ${{ secrets.BUILD_PASSWORD }}
          port: 22
          script: |
            set -e

            echo "== Session =="
            whoami
            id
            hostname
            pwd

            echo "== Hosts =="
            echo "${{ secrets.BUILD_PASSWORD }}" | sudo -S sh -c 'grep -q "registry.lab.local" /etc/hosts || echo "192.168.10.254 registry.lab.local" >> /etc/hosts'
            getent hosts registry.lab.local
            curl -sS -I http://registry.lab.local/v2/ || true

            echo "== Docker =="
            docker version
            docker info | grep -A20 "Insecure Registries" || true
            docker ps >/dev/null

            echo "== GitHub SSH =="
            ssh -T git@github.com || true

            APP_DIR="$HOME/apps/itts"
            REGISTRY="registry.lab.local"
            IMAGE_NAME="itts/be-itts-community"
            IMAGE_TAG="${{ github.sha }}"
            BRANCH="${{ github.ref_name }}"

            mkdir -p "$HOME/apps"

            echo "== Repository =="
            if [ ! -d "$APP_DIR/.git" ]; then
              rm -rf "$APP_DIR"
              git clone git@github.com:daisyorscry/itts.git "$APP_DIR"
            fi

            cd "$APP_DIR"

            git fetch origin
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"

            echo "== Harbor Login =="
            echo "${{ secrets.HARBOR_PASSWORD }}" | docker login "$REGISTRY" \
              --username "${{ secrets.HARBOR_USERNAME }}" \
              --password-stdin

            echo "== Docker Build =="
            docker build \
              -f be-itts-community/Dockerfile \
              -t "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG" \
              -t "$REGISTRY/$IMAGE_NAME:latest" \
              .

            echo "== Docker Push =="
            docker push "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
            docker push "$REGISTRY/$IMAGE_NAME:latest"
