name: Dev Quality Checks

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

concurrency:
  group: dev-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ${{ github.workspace }}/be-itts-community

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: be-itts-community/go.mod
          cache-dependency-path: be-itts-community/go.sum

      - name: Verify Go formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Run Go tests
        run: |
          go test ./...

      - name: Run Go race tests
        run: |
          go test -race ./...

      - name: Run Go vet
        run: |
          go vet ./...

  frontend-checks:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ${{ github.workspace }}/web-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - name: Install frontend dependencies
        run: |
          npm ci

      - name: Run TypeScript typecheck
        run: |
          npx tsc --noEmit

      - name: Build frontend
        env:
          VITE_API_BASE_URL: https://dev-api.itts.fun/api/v1
        run: |
          npm run build

  compose-checks:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate Docker Compose config
        run: |
          docker compose --env-file /opt/env/itts.env config >/dev/null
