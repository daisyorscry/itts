name: Deploy ITTS Community

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build images first
        run: |
          docker compose --env-file /opt/env/itts.env build web api

      - name: Recreate only updated services
        run: |
          docker compose --env-file /opt/env/itts.env up -d --no-deps web api
