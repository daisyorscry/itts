name: Test Workflow

on:
  workflow_dispatch:

env:
  REGISTRY: registry.itts.fun
  PROJECT: library
  IMAGE_NAME: test-runner

jobs:
  test-push:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login registry
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login ${{ env.REGISTRY }} \
            -u "${{ secrets.HARBOR_USERNAME }}" \
            --password-stdin

      - name: Pull test image
        run: docker pull alpine:3.20

      - name: Tag test image
        run: |
          docker tag alpine:3.20 ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}:latest
          docker tag alpine:3.20 ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}

      - name: Push test image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}

      - name: Verify
        run: |
          echo "Pushed:"
          echo "${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}:latest"
          echo "${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}"
