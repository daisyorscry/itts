services:
  web:
    build:
      context: ./web-app
      dockerfile: Dockerfile
    container_name: itts-frontend
    env_file:
      - /opt/env/itts.env
    ports:
      - "10.66.66.1:${PORT}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: ./be-itts-community/Dockerfile
    container_name: itts-backend
    env_file:
      - /opt/env/itts.env
    volumes:
      - /opt/env/itts.env:/app/.env:ro
    ports:
      - "10.66.66.1:${APP_PORT}:${APP_PORT}"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${APP_PORT}/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    container_name: itts-postgres
    env_file:
      - /opt/env/itts.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h 127.0.0.1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: itts-redis
    env_file:
      - /opt/env/itts.env
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "10.66.66.1:6888:6379"
    restart: unless-stopped

volumes:
  db-data: